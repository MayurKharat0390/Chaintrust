[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaintrust"
version = "0.1.0"
description = "Real-agent reputation pipeline with blockchain anchoring"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Core
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Database
    "sqlalchemy>=2.0",

    # Web / API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",

    # LLM providers
    "google-generativeai>=0.7",
    "groq>=0.9",
    "openai>=1.30",          # used for OpenRouter (compatible API)
    "ollama>=0.2",           # optional; Ollama also works via httpx

    # Task benchmarks
    "datasets>=2.19",        # HuggingFace datasets (HumanEval, MBPP fallback)
    # evalplus is installed separately if desired: pip install evalplus

    # Analysis
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "matplotlib>=3.9",

    # Blockchain
    "web3>=6.19",
    "eth-hash[pycryptodome]>=0.7",

    # Dashboard
    "streamlit>=1.35",

    # Utilities
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]
evalplus = [
    "evalplus>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chaintrust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
timeout = 60

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
